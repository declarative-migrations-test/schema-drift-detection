schema_version: 1
managed_by: github-test-org-factory/1.0.0
production_org: declarative-migrations
test_org: declarative-migrations-test
repository: schema-drift-detection
kind: database
readiness: ready
objectives:
- Verify out-of-band tables, columns, indexes, constraints, defaults, and deterministic remediation across the supported
  happy-path states and canonical fixtures.
- Verify out-of-band tables, columns, indexes, constraints, defaults, and deterministic remediation under retries, interruption,
  concurrency, offline operation, or partial failure.
- Verify out-of-band tables, columns, indexes, constraints, defaults, and deterministic remediation preserves authorization,
  idempotency, integrity, observability, and actionable failure classification.
always_on_checks:
- Validate test-plan and dependency metadata.
- Validate generated fixture and workflow syntax.
- Classify missing upstreams or credentials separately from product regressions.
schedule_utc: 23 4 * * 2,5
expensive: false
required_infrastructure:
- PostgreSQL
- CockroachDB
