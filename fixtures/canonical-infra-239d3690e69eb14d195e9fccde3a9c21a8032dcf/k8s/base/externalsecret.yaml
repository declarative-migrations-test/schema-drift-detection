apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: canonical-api-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: canonical-api-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: dd/canonical/api/database-url}
    - secretKey: CANONICAL_INTERNAL_AUTH_TOKEN
      remoteRef: {key: dd/canonical/api/internal-auth-token}
    - secretKey: SHARED_AUTH_INTROSPECT_SECRET
      remoteRef: {key: dd/shared-auth/canonical/introspect-secret}
    - secretKey: GEMINI_API_KEY
      remoteRef: {key: dd/canonical/api/gemini-api-key}
